<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 记忆卡</title>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --ink: #1f1b16;
      --ink-2: #6b6560;
      --ink-3: #a39c94;
      --line: #ece6dd;
      --accent: #de2910;
      --accent-soft: #fbeae6;
      --blue: #3a6ea5;
      --blue-soft: #eaf1f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .shell { width: 100%; max-width: 560px; min-height: 100vh; display: flex; flex-direction: column; }

    /* —— 顶栏 —— */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .mark {
      width: 26px; height: 26px; border-radius: 8px; background: var(--accent);
      color: #fff; font-weight: 700; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
    .brand .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .pill {
      font-size: 12px; color: var(--ink-2);
      border: 1px solid var(--line); background: var(--card);
      padding: 4px 10px; border-radius: 999px;
    }

    /* —— 主区 —— */
    main { flex: 1; padding: 6px 20px 0; }

    .section-label { font-size: 12px; color: var(--ink-3); letter-spacing: 1px; margin: 10px 2px 8px; }

    .mem-list { display: flex; flex-direction: column; gap: 10px; }

    .mem-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;
      box-shadow: 0 1px 2px rgba(31, 27, 22, .04);
      cursor: pointer;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .mem-card:active { transform: translateY(1px); box-shadow: none; }

    .type-badge {
      flex: none; width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .type-badge.audio { background: var(--accent-soft); color: var(--accent); }
    .type-badge.text  { background: var(--blue-soft);  color: var(--blue); }

    .mem-body { flex: 1; min-width: 0; }
    .mem-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    .mem-meta { font-size: 12px; color: var(--ink-3); margin-top: 5px; }

    .mem-dur { flex: none; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

    /* —— 空状态 —— */
    .empty {
      border: 1.5px dashed var(--line); border-radius: 14px; padding: 40px 20px;
      text-align: center; color: var(--ink-3); font-size: 14px;
    }
    .empty strong { display: block; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; }

    /* —— 底栏 —— */
    .dock {
      position: sticky; bottom: 0;
      display: flex; gap: 10px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 70%, rgba(250,247,242,0));
    }
    .btn {
      border: none; cursor: pointer; font-family: inherit; font-weight: 600;
      border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .06s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn.quick {
      flex: 0 0 auto; padding: 0 20px; height: 52px; font-size: 15px;
      background: var(--card); color: var(--ink-2); border: 1px solid var(--line);
    }
    .btn.hold {
      flex: 1; height: 52px; font-size: 16px; color: #fff; background: var(--accent);
      box-shadow: 0 4px 14px rgba(222, 41, 16, .28);
    }
    .btn svg { width: 18px; height: 18px; }

    .footnote { padding: 14px 20px 22px; text-align: center; font-size: 11px; color: var(--ink-3); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="mark">卡</span>
        <div>
          <h1>AI 记忆卡</h1>
          <div class="sub">把说过的话，变成找得到的记忆</div>
        </div>
      </div>
      <span class="pill">Day 7 · MVP</span>
    </header>

    <main>
      <div class="section-label">全部记忆</div>
      <div class="mem-list" id="mem-list"></div>
      <div class="empty" id="empty" hidden>
        <strong>还没有记忆</strong>
        按住下面的按钮开始记录，或点「速记」写一行字。
      </div>
    </main>

    <footer class="dock">
      <button class="btn quick" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        速记
      </button>
      <button class="btn hold" type="button" id="hold-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        按住说话
      </button>
    </footer>

    <div class="footnote">AI 记忆卡 · 第一版可运行页面 · 数据来自本地服务端</div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000/api/v1";

    // 兜底示例数据：仅在后端连不上时使用，保证页面不因网络问题白屏
    const SAMPLE = [
      { type: "audio", title: "今天的会议要点", time: "今天 14:32", duration: "3:24" },
      { type: "text",  title: "一个灵感：录音卡也能当记忆卡", time: "今天 11:05", duration: null },
      { type: "audio", title: "英语跟读练习 · 第 3 遍", time: "昨天 21:40", duration: "0:58" },
    ];

    function rand(n) { return Math.random().toString(36).slice(2, 2 + n); }
    function pad2(n) { return String(n).padStart(2, "0"); }

    function fmtTime(ms) {
      const d = new Date(ms), now = new Date();
      const hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      const y = new Date(now); y.setDate(now.getDate() - 1);
      if (d.toDateString() === now.toDateString()) return "今天 " + hm;
      if (d.toDateString() === y.toDateString()) return "昨天 " + hm;
      return (d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + hm;
    }

    function fmtDur(ms) {
      const s = Math.round(ms / 1000);
      return Math.floor(s / 60) + ":" + pad2(s % 60);
    }

    // 统一请求封装：带 JSON 与 Bearer 头
    async function api(path, opt) {
      opt = opt || {};
      const headers = {};
      if (opt.body) headers["Content-Type"] = "application/json";
      if (opt.token) headers["Authorization"] = "Bearer " + opt.token;
      return fetch(API_BASE + path, {
        method: opt.method || "GET",
        headers: headers,
        body: opt.body ? JSON.stringify(opt.body) : undefined,
      });
    }

    // 静默登录：随机生成本浏览器的演示账号（凭据只存本机 localStorage，不进代码/不进仓库）
    async function ensureToken() {
      let dev = null;
      try { dev = JSON.parse(localStorage.getItem("mc_dev")); } catch (e) {}
      if (!dev) dev = { username: "web-" + rand(8), password: rand(14) };
      let r = await api("/auth/login", { method: "POST", body: { username: dev.username, password: dev.password } });
      if (!r.ok) {
        r = await api("/auth/register", { method: "POST", body: { username: dev.username, password: dev.password, nickname: "网页演示" } });
        if (!r.ok) throw new Error("注册失败 " + r.status);
      }
      const data = await r.json();
      localStorage.setItem("mc_dev", JSON.stringify(dev));
      return data.access_token;
    }

    // 服务端返回的 memory 字段 → 页面渲染所需的最小形状（复用原有 render，UI 不变）
    function toItem(m) {
      return {
        type: m.type,
        title: m.title,
        time: fmtTime(m.created_at),
        duration: m.audio_duration_ms ? fmtDur(m.audio_duration_ms) : null,
      };
    }

    // 列表为空时种入 3 条演示记忆（走真实 PUT，证明「写」链路也通）
    async function seedIfEmpty(token) {
      const now = Date.now();
      const offsets = [0, 3 * 3600 * 1000, 26 * 3600 * 1000];
      const samples = [
        { type: "audio", title: "今天的会议要点", source: "record", duration: 204000 },
        { type: "text",  title: "一个灵感：录音卡也能当记忆卡", source: "quick_note", text: "录音卡除了练口语，还能当记忆卡：记录、整理、找回。" },
        { type: "audio", title: "英语跟读练习 · 第 3 遍", source: "record", duration: 58000 },
      ];
      for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        const id = crypto.randomUUID();
        const body = {
          type: s.type, title: s.title, source: s.source, record_status: "normal",
          created_at: now - offsets[i], updated_at: now - offsets[i],
          client_version: "1.0.0", tag_ids: [],
        };
        if (s.type === "audio") {
          body.audio_object_key = "seed/" + id + ".wav";
          body.audio_duration_ms = s.duration;
          body.audio_format = "wav";
        } else {
          body.text_content = s.text;
        }
        await api("/memories/" + id, { method: "PUT", body: body, token: token });
      }
    }

    async function loadMemories(token) {
      const r = await api("/memories?limit=50", { token: token });
      if (!r.ok) throw new Error("拉取失败 " + r.status);
      const data = await r.json();
      return data.items || [];
    }

    async function load() {
      try {
        let token = await ensureToken();
        let items = await loadMemories(token);
        if (!items.length) {
          await seedIfEmpty(token);
          items = await loadMemories(token);
        }
        render(items.map(toItem));
      } catch (e) {
        console.warn("后端未连接，回退到示例数据：", e);
        render(SAMPLE);
      }
    }

    function render(list) {
      const wrap = document.getElementById("mem-list");
      const empty = document.getElementById("empty");
      wrap.innerHTML = "";
      if (!list.length) { empty.hidden = false; return; }
      empty.hidden = true;
      list.forEach(function (m) {
        const card = document.createElement("div");
        card.className = "mem-card";

        const badge = document.createElement("div");
        badge.className = "type-badge " + m.type;
        badge.textContent = m.type === "audio" ? "音" : "文";

        const body = document.createElement("div");
        body.className = "mem-body";
        const title = document.createElement("div");
        title.className = "mem-title";
        title.textContent = m.title;
        const meta = document.createElement("div");
        meta.className = "mem-meta";
        meta.textContent = m.time;
        body.appendChild(title);
        body.appendChild(meta);

        card.appendChild(badge);
        card.appendChild(body);
        if (m.duration) {
          const dur = document.createElement("div");
          dur.className = "mem-dur";
          dur.textContent = m.duration;
          card.appendChild(dur);
        }
        wrap.appendChild(card);
      });
    }

    // 「按住说话」目前是视觉占位，录音链路在后续步骤接入
    const hold = document.getElementById("hold-btn");
    hold.addEventListener("pointerdown", function () { hold.style.opacity = ".85"; });
    hold.addEventListener("pointerup", function () { hold.style.opacity = "1"; });
    hold.addEventListener("pointercancel", function () { hold.style.opacity = "1"; });

    load();
  </script>
</body>
</html>
